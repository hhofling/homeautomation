# ESP32 Bluetooth proxy so Home Assistant can reach Plejd (and other BLE
# devices) from anywhere in the house. Flash with the ESPHome add-on or
# https://web.esphome.io, then place it near the Plejd devices.
# Any plain ESP32 board works (e.g. ESP32-DevKitC, M5Stack Atom Lite).

substitutions:
  name: plejd-proxy
  friendly_name: Plejd Bluetooth Proxy

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"

captive_portal:
logger:
api:
  encryption:
    key: !secret api_encryption_key
ota:
  - platform: esphome
    password: !secret ota_password

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  # Plejd needs an active (connectable) connection, not just scanning.
  active: true
